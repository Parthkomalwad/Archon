server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback  serve index.html for all non-file paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/ requests to the Archon backend
    location /api/ {
        proxy_pass http://archon:8765/;
        proxy_http_version 1.1;

        # Required for SSE (Server-Sent Events)  disable buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    # Explicit no-buffering for the SSE endpoint
    location /api/logs/stream {
        proxy_pass http://archon:8765/logs/stream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
        proxy_set_header Connection "";
    }
}
