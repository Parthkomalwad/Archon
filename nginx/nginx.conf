# Archon – Nginx TLS reverse-proxy reference configuration
#
# Usage: mount this file into an nginx container and adjust server_name / cert paths.
# See docker-compose.nginx.yml for the full docker-compose integration.
#
# Why this is needed:
#   Archon serves plain HTTP on port 8765  this is intentional.
#   If Archon's port is exposed outside a private Docker network, put this
#   Nginx config in front to terminate TLS before traffic reaches Archon.
#
# SSE note:
#   GET /logs/stream uses Server-Sent Events (long-lived HTTP connections).
#   proxy_buffering must be off and proxy_read_timeout must be long (≥1h)
#   so the stream is not silently dropped by Nginx.

server {
    listen 80;
    server_name archon.example.com;

    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name archon.example.com;

    # ── TLS certificates ────────────────────────────────────────────────────
    # Adjust paths to match your certificate setup (Let's Encrypt, self-signed, etc.)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Proxy to Archon ─────────────────────────────────────────────────────
    location / {
        proxy_pass         http://archon:8765;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for SSE (GET /logs/stream):
        #   Disable buffering so events are flushed immediately to the browser.
        proxy_buffering    off;
        proxy_cache        off;

        # Allow long-lived SSE connections without Nginx closing them.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
